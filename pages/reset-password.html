<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restablecer Contraseña - PaperCraft Systems</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    html {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f1829 100%);
      min-height: 100%;
    }
    body {
      background: transparent;
      color: #e8ecf1;
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .reset-card {
      width: 100%;
      max-width: 420px;
      background: rgba(15, 24, 41, 0.9);
      border: 2px solid #00D9FF;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0, 217, 255, 0.35);
      padding: 36px 32px;
      animation: neonCycleBorder 10s linear infinite;
    }

    .reset-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      margin-bottom: 22px;
    }
    .reset-logo .nav-logo-wrap { width: 34px; height: 34px; }
    .reset-logo span:last-child {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary-700);
      letter-spacing: 0.5px;
    }

    .reset-card h1 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 8px;
      color: #00D9FF;
    }
    .reset-card p.subtitle {
      text-align: center;
      color: #a8b8cc;
      font-size: 0.85rem;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .reset-form { display: flex; flex-direction: column; gap: 14px; }
    .reset-form label { font-size: 0.8rem; color: #a8b8cc; margin-bottom: -6px; }
    .reset-form input {
      padding: 12px 14px;
      background: rgba(10, 14, 39, 0.8);
      border: 2px solid #00D9FF;
      color: #e8ecf1;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
    }
    .reset-form input:focus { outline: none; box-shadow: 0 0 12px rgba(0, 217, 255, 0.6); }

    .reset-status {
      text-align: center;
      font-size: 0.85rem;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      display: none;
    }
    .reset-status.show { display: block; }
    .reset-status.info { background: rgba(0, 217, 255, 0.1); border: 1px solid #00D9FF; color: #00D9FF; }
    .reset-status.error { background: rgba(255, 0, 110, 0.1); border: 1px solid #FF006E; color: #FF006E; }
    .reset-status.success { background: rgba(57, 255, 20, 0.1); border: 1px solid #39FF14; color: #39FF14; }

    .reset-back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #a8b8cc;
      font-size: 0.8rem;
      text-decoration: none;
    }
    .reset-back:hover { color: #00D9FF; }
  </style>
</head>
<body>

  <div class="reset-card">
    <div class="reset-logo">
      <div class="nav-logo-wrap"><span></span></div>
      <span>PaperCraft</span>
    </div>

    <h1 id="reset-title">Nueva contraseña</h1>
    <p class="subtitle" id="reset-subtitle">
      Verificando tu enlace de recuperación...
    </p>

    <div id="reset-status" class="reset-status"></div>

    <form id="reset-form" class="reset-form" style="display:none;" onsubmit="handleResetSubmit(event)">
      <label for="new-password">Nueva contraseña</label>
      <input type="password" id="new-password" placeholder="Mínimo 6 caracteres" required minlength="6">

      <label for="confirm-password">Confirmar contraseña</label>
      <input type="password" id="confirm-password" placeholder="Repite la contraseña" required minlength="6">

      <button type="submit" class="btn" style="width: 100%; padding: 12px; margin-top: 6px;">
        Guardar nueva contraseña
      </button>
    </form>

    <a href="../index.html" class="reset-back">&larr; Volver al inicio</a>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/reset-password.js"></script>
</body>
</html>
