<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda - PaperCraft Systems</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    /* el fondo también va en <html>, no solo en <body> — si no, cuando el
       modal bloquea el scroll (position: fixed en body), se asoma el
       blanco por defecto del navegador en el hueco que queda */
    /* el fondo vive SOLO acá (no también en <body>): así <body> queda
       transparente y la lluvia de números (z-index: -1) se sigue viendo
       por delante del fondo, en vez de quedar tapada */
    html {
      background: linear-gradient(135deg, #0a0e27 0%, #1a1a3e 50%, #0f1829 100%);
    }
    body {
      background: transparent;
      color: #e8ecf1;
      font-family: 'Inter', 'Segoe UI', sans-serif;
    }

    /* NAVBAR, .btn, .btn-danger, .btn-logout: definidos en css/app.css */
    .container { max-width: 1200px; margin: 0 auto; padding: 40px 5%; }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #00D9FF, #FF006E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 40px;
      padding: 20px;
      background: rgba(26, 26, 62, 0.6);
      border: 2px solid #00D9FF;
      border-radius: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-group label {
      color: #00D9FF;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .filter-group select,
    .filter-group input {
      padding: 8px;
      background: rgba(15, 24, 41, 0.8);
      border: 1.5px solid #00D9FF;
      color: #e8ecf1;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .add-product-btn {
      margin-bottom: 20px;
      padding: 12px 24px;
      font-size: 0.95rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: rgba(26, 26, 62, 0.6);
      border: 2px solid #00D9FF;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
    }

    .product-card:hover {
      border-color: #FF006E;
      box-shadow: 0 0 40px rgba(255, 0, 110, 0.5);
      transform: translateY(-10px);
    }

    .product-image {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.1), rgba(255, 0, 110, 0.1));
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      color: #00D9FF;
      font-weight: 700;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .product-category {
      color: #a8b8cc;
      font-size: 0.75rem;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .product-description {
      color: #a8b8cc;
      font-size: 0.78rem;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      color: #39FF14;
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .product-stock {
      color: #a8b8cc;
      font-size: 0.75rem;
      margin-bottom: 10px;
    }

    .product-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .product-btn {
      flex: 1;
      min-width: 60px;
      padding: 7px;
      background: linear-gradient(135deg, #00D9FF, #0066FF);
      color: #0a0e27;
      border: 1.5px solid #00D9FF;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
    }

    .product-btn:hover {
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
    }

    footer {
      background: rgba(10, 14, 39, 0.95);
      border-top: 2px solid #00D9FF;
      padding: 40px 5%;
      text-align: center;
      color: #a8b8cc;
      margin-top: 60px;
    }

    @media (max-width: 768px) {
      .nav-links { display: none; }
      .filters { grid-template-columns: repeat(2, 1fr); }
      .filter-group { min-width: 0; }
      .filter-group select,
      .filter-group input { min-width: 0; width: 100%; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
    }
  
    /* Pantalla de carga: zorro sentado esperando + anillo girando. Se
       muestra apenas arranca la página y se oculta solo cuando los datos
       ya están listos para mostrarse. */
    #pageLoader {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: #0a0e27;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.35s ease;
    }
    #pageLoader.page-loader-hidden {
      opacity: 0;
      pointer-events: none;
    }
    .page-loader-ring-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .page-loader-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid rgba(0, 217, 255, 0.15);
      border-top-color: #00D9FF;
      border-right-color: #FF006E;
      animation: pageLoaderSpin 1s linear infinite;
    }
    .page-loader-fox {
      width: 56px;
      height: auto;
      image-rendering: pixelated;
      filter: drop-shadow(0 0 8px rgba(255, 122, 26, 0.7));
    }
    @keyframes pageLoaderSpin {
      to { transform: rotate(360deg); }
    }
    .page-loader-text {
      color: #a8b8cc;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }
    @media (prefers-reduced-motion: reduce) {
      .page-loader-ring { animation: none; }
    }

    /* Título "TIENDA NEOCRAFT" con el mismo efecto de degradado animado
       que el título grande del inicio (el color va rotando solo). */
    .shop-title {
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 900;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #00D9FF, #FF006E, #39FF14, #00D9FF);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shopTitleGradient 3s ease infinite;
    }
    @keyframes shopTitleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Buscador con lupa */
    .search-bar-wrap {
      position: relative;
      max-width: 480px;
      margin-bottom: 20px;
    }
    .search-bar-wrap .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #00D9FF;
      pointer-events: none;
      display: flex;
    }
    #searchProducto {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(15, 24, 41, 0.8);
      border: 1px solid #00D9FF;
      border-radius: 8px;
      color: #e8ecf1;
      font-size: 0.95rem;
    }
    #searchProducto:focus {
      outline: none;
      box-shadow: 0 0 12px rgba(0, 217, 255, 0.5);
    }
  </style>
</head>
<body>
<div id="pageLoader">
  <div class="page-loader-ring-wrap">
    <div class="page-loader-ring"></div>
    <svg class="page-loader-fox" viewBox="0 0 32 28" shape-rendering="crispEdges">
      <!-- cola enroscada al frente -->
      <rect x="20" y="16" width="2" height="6" fill="#FF7A1A"/>
      <rect x="22" y="20" width="4" height="2" fill="#FF7A1A"/>
      <rect x="24" y="16" width="2" height="4" fill="#FF7A1A"/>
      <!-- cuerpo sentado (más ancho abajo) -->
      <rect x="8" y="14" width="14" height="8" fill="#FF9F3D"/>
      <rect x="6" y="20" width="18" height="4" fill="#FF9F3D"/>
      <rect x="10" y="18" width="8" height="4" fill="#FFF3E0"/>
      <!-- cabeza -->
      <rect x="9" y="4" width="12" height="10" fill="#FF9F3D"/>
      <rect x="11" y="10" width="8" height="4" fill="#FFF3E0"/>
      <!-- orejas -->
      <rect x="9" y="1" width="3" height="4" fill="#FF7A1A"/>
      <rect x="18" y="1" width="3" height="4" fill="#FF7A1A"/>
      <!-- ojos cerrados (esperando tranquilo) -->
      <rect x="12" y="8" width="2" height="1" fill="#2B1810"/>
      <rect x="17" y="8" width="2" height="1" fill="#2B1810"/>
      <!-- hocico -->
      <rect x="14" y="11" width="2" height="2" fill="#2B1810"/>
      <!-- patas delanteras -->
      <rect x="9" y="21" width="2" height="3" fill="#2B1810"/>
      <rect x="15" y="21" width="2" height="3" fill="#2B1810"/>
    </svg>
  </div>
  <p class="page-loader-text">Cargando...</p>
</div>
<script>
  // Salvaguarda: si algo falla o tarda demasiado, el loader se oculta
  // solo a los 8 segundos, para no dejar a nadie mirando la pantalla de
  // carga para siempre.
  setTimeout(() => {
    const el = document.getElementById('pageLoader');
    if (el) el.classList.add('page-loader-hidden');
  }, 8000);
</script>

<div class="container">
  <h1 class="shop-title">TIENDA NEOCRAFT</h1>

  <button class="btn add-product-btn" data-admin-only style="display: none;" onclick="openAddProductModal()">
     Agregar Producto
  </button>

  <div class="search-bar-wrap">
    <span class="search-icon" data-icon="search" data-icon-size="18"></span>
    <input type="text" id="searchProducto" placeholder="Buscar producto por nombre..." oninput="filtrarProductos()">
  </div>
  
  <div class="filters">
    <div class="filter-group">
      <label>Categoría</label>
      <select id="categoria" onchange="filtrarProductos()">
        <option value="">Todas</option>
        <option value="papelería">Papelería</option>
        <option value="tecnología">Tecnología</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Precio Máx. (COP)</label>
      <input type="number" id="precioMax" value="500000" step="10000" onchange="filtrarProductos()">
    </div>
    <div class="filter-group">
      <label>Ordenar</label>
      <select id="ordenar" onchange="filtrarProductos()">
        <option value="">Relevancia</option>
        <option value="precio-bajo">Precio: Menor a Mayor</option>
        <option value="precio-alto">Precio: Mayor a Menor</option>
      </select>
    </div>
  </div>

  <div class="products-grid" id="productosGrid">
    <!-- Productos se cargarán aquí -->
  </div>

<script>
  // Verificar autenticación y cargar página
  window.addEventListener('load', async () => {
    await Promise.all([window.AuthManager.ready(), window.DataManager.ready()]);
    const _pageLoader = document.getElementById('pageLoader');
    if (_pageLoader) _pageLoader.classList.add('page-loader-hidden');
    const auth = window.AuthManager;
    
    // Actualizar navbar
    window.UIManager.updateUIByRole();

    if (!auth.isAuthenticated) {
      mostrarBloqueoSinSesion();
      window.UIManager.toast('Inicia sesión para ver el catálogo', 'warning');
      openLoginModal();
      return;
    }

    filtrarProductos();
  });

  // si el login se completa en esta misma página, carga el catálogo sin recargar
  window.addEventListener('userLoggedIn', () => {
    window.UIManager.updateUIByRole();
    filtrarProductos();
  });

  function mostrarBloqueoSinSesion() {
    const grid = document.getElementById('productosGrid');
    grid.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #a8b8cc;">
        <p style="font-size: 1.1rem; margin-bottom: 16px;">Inicia sesión para ver los productos de la tienda.</p>
        <button class="btn" onclick="openLoginModal()">Iniciar Sesión</button>
      </div>
    `;
  }

  function filtrarProductos() {
    if (!window.AuthManager.isAuthenticated) {
      mostrarBloqueoSinSesion();
      return;
    }

    const categoria = document.getElementById('categoria').value;
    const precioMax = parseInt(document.getElementById('precioMax').value) || 500000;
    const ordenar = document.getElementById('ordenar').value;
    const busqueda = (document.getElementById('searchProducto')?.value || '').trim().toLowerCase();
    
    let productos = window.DataManager.getProducts();
    
    // Filtrar
    productos = productos.filter(p => {
      return (categoria === '' || p.categoria === categoria)
        && p.precio <= precioMax
        && (busqueda === '' || p.nombre.toLowerCase().includes(busqueda));
    });

    // Ordenar
    if (ordenar === 'precio-bajo') {
      productos.sort((a, b) => a.precio - b.precio);
    } else if (ordenar === 'precio-alto') {
      productos.sort((a, b) => b.precio - a.precio);
    }

    mostrarProductos(productos);
  }

  // si la imagen falla, usa el ícono de respaldo (data-* evita mezclar comillas del SVG)
  function handleProductImgError(imgEl) {
    const container = imgEl.parentElement;
    const iconName = container.getAttribute('data-fallback-icon') || 'package';
    container.innerHTML = Icons.svg(iconName, { size: 40 });
  }

  function mostrarProductos(items) {
    const grid = document.getElementById('productosGrid');
    const auth = window.AuthManager;
    const isAdmin = auth.hasPermission('admin');

    grid.innerHTML = items.map(p => `
      <div class="product-card">
        <div class="product-image" data-fallback-icon="${p.icon || 'package'}">${p.imagen ? `<img src="${escapeHtml(p.imagen)}" alt="${escapeHtml(p.nombre)}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;" onerror="handleProductImgError(this)">` : Icons.svg(p.icon || 'package', { size: 40 })}</div>
        <div class="product-info">
          <div class="product-category">${p.categoria}</div>
          <div class="product-name">${p.nombre}</div>
          ${p.description ? `<div class="product-description">${escapeHtml(p.description)}</div>` : ''}
          <div class="product-price">${formatCOP(p.precio)}</div>
          <div class="product-stock">Stock: ${p.stock}</div>
          <div class="product-actions">
            <button class="product-btn" onclick="agregarCarrito(${p.id})" data-auth-only> Agregar</button>
            ${isAdmin ? `
              <button class="product-btn btn-danger" onclick="openEditProductModal(${p.id})"> Editar</button>
              <button class="product-btn btn-danger" onclick="deleteProduct(${p.id})"> Borrar</button>
            ` : ''}
          </div>
        </div>
      </div>
    `).join('');

    // Actualizar visibilidad de botones según auth
    window.UIManager.updateUIByRole();
  }

  function agregarCarrito(id) {
    const auth = window.AuthManager;
    if (!auth.isAuthenticated) {
      window.UIManager.toast('Debes iniciar sesión para agregar al carrito', 'warning');
      return;
    }

    const producto = window.DataManager.getProductById(id);
    if (!producto || producto.stock <= 0) {
      window.UIManager.toast('Producto sin stock', 'error');
      return;
    }

    const result = window.DataManager.addToCart(producto);
    if (result.success) {
      window.UIManager.toast(`${producto.nombre} agregado al carrito`, 'success');
    } else {
      window.UIManager.toast(result.message, 'warning');
    }
  }

  function openAddProductModal() {
    const form = `
      <form onsubmit="handleAddProduct(event)" style="display: flex; flex-direction: column; gap: 15px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Nombre del producto</label>
          <input type="text" id="new-producto-nombre" placeholder="Ej: Teclado Mecánico RGB" required 
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Categoría</label>
          <select id="new-producto-categoria" required style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
            <option value="papelería">Papelería</option>
            <option value="tecnología">Tecnología</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Precio</label>
          <input type="number" id="new-producto-precio" placeholder="52000" step="1000" required 
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Descripción</label>
          <textarea id="new-producto-descripcion" rows="3" placeholder="Descripción del producto (se muestra en la tienda)"
                    style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px; font-family: inherit; resize: vertical;"></textarea>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Stock</label>
          <input type="number" id="new-producto-stock" placeholder="50" required 
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">URL de imagen (opcional)</label>
          <input type="text" id="new-producto-imagen" placeholder="https://..."
                 oninput="previewProductoImagen('new-producto-imagen-preview', this.value)"
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
          <p style="color:#6b7a90; font-size:0.72rem;">Si la dejas vacía, se muestra el ícono en la tienda.</p>
          <img id="new-producto-imagen-preview" style="max-width:100%; max-height:120px; border-radius:8px; display:none;" onerror="this.style.display='none';" onload="this.style.display='block';">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Icono</label>
          <select id="new-producto-icon"
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
            <option value="package">Paquete</option>
            <option value="notebook">Cuaderno</option>
            <option value="book">Libro</option>
            <option value="palette">Paleta</option>
            <option value="document">Documento</option>
            <option value="gamepad">Tecnología</option>
            <option value="target">Precisión</option>
            <option value="bell">Audio</option>
            <option value="gift">Regalo</option>
            <option value="star">Destacado</option>
          </select>
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 12px; margin-top: 10px;">
          Agregar Producto
        </button>
      </form>
    `;
    window.UIManager.openModal(form, 'Nuevo Producto');
  }

  // Muestra una vista previa mientras se escribe la URL de la imagen; si
  // no carga (URL rota o vacía), la vista previa simplemente se oculta.
  function previewProductoImagen(previewId, url) {
    const img = document.getElementById(previewId);
    if (!img) return;
    if (!url) {
      img.style.display = 'none';
      img.removeAttribute('src');
      return;
    }
    img.src = url;
  }

  function openEditProductModal(productId) {
    const product = window.DataManager.getProductById(productId);
    const form = `
      <form onsubmit="handleEditProduct(${productId}, event)" style="display: flex; flex-direction: column; gap: 15px;">
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Nombre</label>
          <input type="text" id="edit-producto-nombre" value="${product.nombre}" required 
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Categoría</label>
          <select id="edit-producto-categoria" required style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
            <option value="papelería" ${product.categoria === 'papelería' ? 'selected' : ''}>Papelería</option>
            <option value="tecnología" ${product.categoria === 'tecnología' ? 'selected' : ''}>Tecnología</option>
          </select>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Precio</label>
          <input type="number" id="edit-producto-precio" value="${product.precio}" step="1000" required 
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Descripción</label>
          <textarea id="edit-producto-descripcion" rows="3" placeholder="Descripción del producto (se muestra en la tienda)"
                    style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px; font-family: inherit; resize: vertical;">${escapeHtml(product.description || '')}</textarea>
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">Stock</label>
          <input type="number" id="edit-producto-stock" value="${product.stock}" required 
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
        </div>
        <div style="display: flex; flex-direction: column; gap: 8px;">
          <label style="color: #00D9FF; font-weight: 700;">URL de imagen (opcional)</label>
          <input type="text" id="edit-producto-imagen" value="${escapeHtml(product.imagen || '')}" placeholder="https://..."
                 oninput="previewProductoImagen('edit-producto-imagen-preview', this.value)"
                 style="padding: 10px; background: rgba(15, 24, 41, 0.8); border: 1px solid #00D9FF; color: #e8ecf1; border-radius: 6px;">
          <p style="color:#6b7a90; font-size:0.72rem;">Si la dejas vacía, se muestra el ícono en la tienda.</p>
          <img id="edit-producto-imagen-preview" src="${escapeHtml(product.imagen || '')}" style="max-width:100%; max-height:120px; border-radius:8px; ${product.imagen ? '' : 'display:none;'}" onerror="this.style.display='none';" onload="this.style.display='block';">
        </div>
        <button type="submit" class="btn" style="width: 100%; padding: 12px; margin-top: 10px;">
           Guardar Cambios
        </button>
      </form>
    `;
    window.UIManager.openModal(form, ' Editar Producto');
  }

  async function handleAddProduct(event) {
    event.preventDefault();
    try {
      const product = {
        nombre: document.getElementById('new-producto-nombre').value,
        categoria: document.getElementById('new-producto-categoria').value,
        precio: document.getElementById('new-producto-precio').value,
        stock: document.getElementById('new-producto-stock').value,
        icon: document.getElementById('new-producto-icon').value || 'package',
        imagen: document.getElementById('new-producto-imagen').value.trim(),
        description: document.getElementById('new-producto-descripcion').value.trim()
      };
      await window.DataManager.addProduct(product);
      window.UIManager.closeModal();
      window.UIManager.toast('Producto agregado', 'success');
      filtrarProductos();
    } catch (error) {
      window.UIManager.toast('Error: ' + error.message, 'error');
    }
  }

  async function handleEditProduct(productId, event) {
    event.preventDefault();
    const updates = {
      nombre: document.getElementById('edit-producto-nombre').value,
      categoria: document.getElementById('edit-producto-categoria').value,
      precio: document.getElementById('edit-producto-precio').value,
      stock: document.getElementById('edit-producto-stock').value,
      imagen: document.getElementById('edit-producto-imagen').value.trim(),
      description: document.getElementById('edit-producto-descripcion').value.trim()
    };
    const updated = await window.DataManager.updateProduct(productId, updates);
    if (!updated) {
      window.UIManager.toast('No se pudo actualizar el producto', 'error');
      return;
    }
    window.UIManager.closeModal();
    window.UIManager.toast('Producto actualizado', 'success');
    filtrarProductos();
  }

  async function deleteProduct(productId) {
    if (confirm('¿Estás seguro de que deseas eliminar este producto?')) {
      const ok = await window.DataManager.deleteProduct(productId);
      if (!ok) {
        window.UIManager.toast('No se pudo eliminar el producto', 'error');
        return;
      }
      window.UIManager.toast('Producto eliminado', 'success');
      filtrarProductos();
    }
  }

  // logout() está definido globalmente en js/ui.js

  // Escuchar cambios en productos
  window.addEventListener('productsUpdated', () => {
    filtrarProductos();
  });
</script>

</body>
</html>
