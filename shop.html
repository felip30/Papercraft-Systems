<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda - PaperCraft Systems</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/main.css">
  <style>

    /* NAVBAR, .btn, .btn-danger, .btn-logout: definidos en css/app.css */

    h1 {
      font-size: 2.5rem;
      margin-bottom: 40px;
      background: linear-gradient(135deg, #00D9FF, #FF006E);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 40px;
      padding: 20px;
      background: rgba(26, 26, 62, 0.6);
      border: 2px solid #00D9FF;
      border-radius: 12px;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .filter-group label {
      color: #00D9FF;
      font-weight: 700;
      font-size: 0.9rem;
    }

    .filter-group select,
    .filter-group input {
      padding: 8px;
      background: rgba(15, 24, 41, 0.8);
      border: 1.5px solid #00D9FF;
      color: #e8ecf1;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .add-product-btn {
      margin-bottom: 20px;
      padding: 12px 24px;
      font-size: 0.95rem;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 25px;
    }

    .product-card {
      background: rgba(26, 26, 62, 0.6);
      border: 2px solid #00D9FF;
      border-radius: 12px;
      overflow: hidden;
      transition: all 0.3s;
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.2);
    }

    .product-card:hover {
      border-color: #FF006E;
      box-shadow: 0 0 40px rgba(255, 0, 110, 0.5);
      transform: translateY(-10px);
    }

    .product-image {
      background: linear-gradient(135deg, rgba(0, 217, 255, 0.1), rgba(255, 0, 110, 0.1));
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
    }

    .product-info {
      padding: 15px;
    }

    .product-name {
      color: #00D9FF;
      font-weight: 700;
      margin-bottom: 5px;
      font-size: 0.9rem;
    }

    .product-category {
      color: #a8b8cc;
      font-size: 0.75rem;
      margin-bottom: 8px;
      text-transform: capitalize;
    }

    .product-description {
      color: #a8b8cc;
      font-size: 0.78rem;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      color: #39FF14;
      font-size: 1.2rem;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .product-stock {
      color: #a8b8cc;
      font-size: 0.75rem;
      margin-bottom: 10px;
    }

    .product-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .product-btn {
      flex: 1;
      min-width: 60px;
      padding: 7px;
      background: linear-gradient(135deg, #00D9FF, #0066FF);
      color: #0a0e27;
      border: 1.5px solid #00D9FF;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0, 217, 255, 0.3);
    }

    .product-btn:hover {
      box-shadow: 0 0 20px rgba(0, 217, 255, 0.6);
    }


    @media (max-width: 768px) {
      .nav-links { display: none; }
      .filters { grid-template-columns: repeat(2, 1fr); }
      .filter-group { min-width: 0; }
      .filter-group select,
      .filter-group input { min-width: 0; width: 100%; }
      .products-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
    }
  
    /* Título "TIENDA NEOCRAFT" con el mismo efecto de degradado animado
       que el título grande del inicio (el color va rotando solo). */
    .shop-title {
      font-size: clamp(2rem, 7vw, 3.2rem);
      font-weight: 900;
      margin-bottom: 25px;
      background: linear-gradient(135deg, #00D9FF, #FF006E, #39FF14, #00D9FF);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shopTitleGradient 3s ease infinite;
    }
    @keyframes shopTitleGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Buscador con lupa */
    .search-bar-wrap {
      position: relative;
      max-width: 480px;
      margin-bottom: 20px;
    }
    .search-bar-wrap .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #00D9FF;
      pointer-events: none;
      display: flex;
    }
    #searchProducto {
      width: 100%;
      padding: 12px 14px 12px 42px;
      background: rgba(15, 24, 41, 0.8);
      border: 1px solid #00D9FF;
      border-radius: 8px;
      color: #e8ecf1;
      font-size: 0.95rem;
    }
    #searchProducto:focus {
      outline: none;
      box-shadow: 0 0 12px rgba(0, 217, 255, 0.5);
    }
  </style>
</head>
<body>
<script src="js/page-loader.js"></script>



<script src="js/navbar.js" data-pagina="shop" data-brand-size="20"></script>

<div class="container">
  <h1 class="shop-title">TIENDA NEOCRAFT</h1>

  <button class="btn add-product-btn" data-admin-only style="display: none;" onclick="openAddProductModal()">
     Agregar Producto
  </button>

  <div class="search-bar-wrap">
    <span class="search-icon" data-icon="search" data-icon-size="18"></span>
    <input type="text" id="searchProducto" placeholder="Buscar producto por nombre..." oninput="filtrarProductos()">
  </div>
  
  <div class="filters">
    <div class="filter-group">
      <label>Categoría</label>
      <select id="categoria" onchange="filtrarProductos()">
        <option value="">Todas</option>
        <option value="papelería">Papelería</option>
        <option value="tecnología">Tecnología</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Precio Máx. (COP)</label>
      <input type="number" id="precioMax" value="500000" step="10000" onchange="precioMaxTocado = true; filtrarProductos()">
    </div>
    <div class="filter-group">
      <label>Ordenar</label>
      <select id="ordenar" onchange="filtrarProductos()">
        <option value="">Relevancia</option>
        <option value="precio-bajo">Precio: Menor a Mayor</option>
        <option value="precio-alto">Precio: Mayor a Menor</option>
      </select>
    </div>
  </div>

  <div class="products-grid" id="productosGrid">
    <!-- Productos se cargarán aquí -->
  </div>
</div>

<footer>
  <p>&copy; 2026 PaperCraft Systems Diseña • Construye • Domina</p>
</footer>

<!-- SCRIPTS -->
<script src="js/utils/icons.js"></script>
<script src="js/utils/currency.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" integrity="sha384-JcnsjUPPylna1s1fvi1u12X5qjY5OL56iySh75FdtrwhO/SWXgMjoVqcKyIIWOLk" crossorigin="anonymous"></script>
<script src="js/comprobante.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js" integrity="sha384-A97u3Qnt9GZHURO9YJZRe7VQgGUeFzcv6I1oIGnUTxQrCxnpQMwR0/G8F2zt9abZ" crossorigin="anonymous"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/dataManager.js"></script>
<script src="js/ui.js"></script>
<script src="js/product-form.js"></script>

<script>
  // Verificar autenticación y cargar página
  window.addEventListener('load', async () => {
    await Promise.all([window.AuthManager.ready(), window.DataManager.ready()]);
    const _pageLoader = document.getElementById('pageLoader');
    if (_pageLoader) _pageLoader.classList.add('page-loader-hidden');
    const auth = window.AuthManager;
    
    // Actualizar navbar
    window.UIManager.updateUIByRole();

    if (!auth.isAuthenticated) {
      mostrarBloqueoSinSesion();
      window.UIManager.toast('Inicia sesión para ver el catálogo', 'warning');
      openLoginModal();
      return;
    }

    filtrarProductos();
  });

  // si el login se completa en esta misma página, carga el catálogo sin recargar
  window.addEventListener('userLoggedIn', () => {
    window.UIManager.updateUIByRole();
    filtrarProductos();
  });

  function mostrarBloqueoSinSesion() {
    const grid = document.getElementById('productosGrid');
    grid.innerHTML = `
      <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #a8b8cc;">
        <p style="font-size: 1.1rem; margin-bottom: 16px;">Inicia sesión para ver los productos de la tienda.</p>
        <button class="btn" onclick="openLoginModal()">Iniciar Sesión</button>
      </div>
    `;
  }

  // true cuando el usuario cambia "Precio Máx." a mano; mientras sea false,
  // el tope se ajusta solo al producto más caro para que ninguno quede oculto
  let precioMaxTocado = false;

  function ajustarPrecioMaxPorDefecto() {
    if (precioMaxTocado) return;
    const input = document.getElementById('precioMax');
    const masCaro = window.DataManager.getProducts()
      .reduce((max, p) => Math.max(max, Number(p.precio) || 0), 0);
    const tope = Math.max(500000, Math.ceil(masCaro / 10000) * 10000);
    input.value = tope;
  }

  function filtrarProductos() {
    if (!window.AuthManager.isAuthenticated) {
      mostrarBloqueoSinSesion();
      return;
    }

    ajustarPrecioMaxPorDefecto();

    const categoria = document.getElementById('categoria').value;
    const precioMax = parseInt(document.getElementById('precioMax').value) || 500000;
    const ordenar = document.getElementById('ordenar').value;
    const busqueda = (document.getElementById('searchProducto')?.value || '').trim().toLowerCase();
    const esAdmin = window.AuthManager.hasPermission('admin');

    let productos = window.DataManager.getProducts();

    // Filtrar (los inactivos solo los ve el admin)
    productos = productos.filter(p => {
      return (esAdmin || p.status === 'activo')
        && (categoria === '' || p.categoria === categoria)
        && p.precio <= precioMax
        && (busqueda === '' || p.nombre.toLowerCase().includes(busqueda));
    });

    // Ordenar
    if (ordenar === 'precio-bajo') {
      productos.sort((a, b) => a.precio - b.precio);
    } else if (ordenar === 'precio-alto') {
      productos.sort((a, b) => b.precio - a.precio);
    }

    mostrarProductos(productos);
  }

  function mostrarProductos(items) {
    const grid = document.getElementById('productosGrid');
    const auth = window.AuthManager;
    const isAdmin = auth.hasPermission('admin');

    grid.innerHTML = items.map(p => `
      <div class="product-card">
        <div class="product-image" data-fallback-icon="${escapeHtml(p.icon || 'package')}">${productImageHtml(p)}</div>
        <div class="product-info">
          <div class="product-category">${escapeHtml(p.categoria)}</div>
          <div class="product-name">${escapeHtml(p.nombre)}</div>
          ${p.description ? `<div class="product-description">${escapeHtml(p.description)}</div>` : ''}
          <div class="product-price">${formatCOP(p.precio)}</div>
          <div class="product-stock">Stock: ${p.stock}</div>
          <div class="product-actions">
            <button class="product-btn" onclick="agregarCarrito(${p.id})" data-auth-only> Agregar</button>
            ${isAdmin ? `
              <button class="product-btn btn-danger" onclick="openEditProductModal(${p.id})"> Editar</button>
              <button class="product-btn btn-danger" onclick="deleteProduct(${p.id})"> Borrar</button>
            ` : ''}
          </div>
        </div>
      </div>
    `).join('');

    // Actualizar visibilidad de botones según auth
    window.UIManager.updateUIByRole();
  }

  function agregarCarrito(id) {
    const auth = window.AuthManager;
    if (!auth.isAuthenticated) {
      window.UIManager.toast('Debes iniciar sesión para agregar al carrito', 'warning');
      return;
    }

    const producto = window.DataManager.getProductById(id);
    if (!producto || producto.stock <= 0) {
      window.UIManager.toast('Producto sin stock', 'error');
      return;
    }

    const result = window.DataManager.addToCart(producto);
    if (result.success) {
      window.UIManager.toast(`${producto.nombre} agregado al carrito`, 'success');
    } else {
      window.UIManager.toast(result.message, 'warning');
    }
  }

  function openAddProductModal() {
    const form = buildProductForm({
      prefijo: 'new-producto',
      color: '#00D9FF',
      onSubmit: 'handleAddProduct(event)',
      etiquetaNombre: 'Nombre del producto',
      textoBoton: 'Agregar Producto',
      estiloBoton: 'width: 100%; padding: 12px; margin-top: 10px;'
    });
    window.UIManager.openModal(form, 'Nuevo Producto');
  }

  function openEditProductModal(productId) {
    const product = window.DataManager.getProductById(productId);
    const form = buildProductForm({
      prefijo: 'edit-producto',
      color: '#00D9FF',
      onSubmit: `handleEditProduct(${Number(productId)}, event)`,
      producto: product,
      conIcono: false,
      textoBoton: ' Guardar Cambios',
      estiloBoton: 'width: 100%; padding: 12px; margin-top: 10px;'
    });
    window.UIManager.openModal(form, ' Editar Producto');
  }

  async function handleAddProduct(event) {
    event.preventDefault();
    try {
      const product = readProductForm('new-producto');
      await window.DataManager.addProduct(product);
      window.UIManager.closeModal();
      window.UIManager.toast('Producto agregado', 'success');
      filtrarProductos();
    } catch (error) {
      window.UIManager.toast('Error: ' + error.message, 'error');
    }
  }

  async function handleEditProduct(productId, event) {
    event.preventDefault();
    const updates = readProductForm('edit-producto', false);
    const updated = await window.DataManager.updateProduct(productId, updates);
    if (!updated) {
      window.UIManager.toast('No se pudo actualizar el producto', 'error');
      return;
    }
    window.UIManager.closeModal();
    window.UIManager.toast('Producto actualizado', 'success');
    filtrarProductos();
  }

  async function deleteProduct(productId) {
    if (confirm('¿Estás seguro de que deseas eliminar este producto?')) {
      const ok = await window.DataManager.deleteProduct(productId);
      if (!ok) {
        window.UIManager.toast('No se pudo eliminar el producto', 'error');
        return;
      }
      window.UIManager.toast('Producto eliminado', 'success');
      filtrarProductos();
    }
  }

  // logout() está definido globalmente en js/ui.js

  // Escuchar cambios en productos
  window.addEventListener('productsUpdated', () => {
    filtrarProductos();
  });
</script>

</body>
</html>
